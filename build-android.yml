name: Build Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify files exist
        run: |
          echo "Checking required files..."
          ls -la android/app/src/main/assets/public/ || echo "public folder missing"
          ls -la android/app/src/main/assets/public/index.html || echo "index.html missing"
          echo "Checking capacitor config..."
          cat android/app/src/main/assets/capacitor.config.json

      - name: Decode and write keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "Keystore file created"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release AAB (for Google Play)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Build Release APK (for direct install)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: opictuary-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK (for direct install)
        uses: actions/upload-artifact@v4
        with:
          name: opictuary-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
