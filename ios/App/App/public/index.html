  <body style="margin: 0; padding: 0; background: #fff">
    <!-- Debug banner - shows at bottom, changes color based on load status -->
    <div
      id="native-debug"
      style="
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #dc2626;
        color: white;
        padding: 12px;
        text-align: center;
        z-index: 999999;
        font-size: 14px;
        font-weight: bold;
        font-family: system-ui;
      "
    >
      v1.4.0 | Loading...
    </div>

    <!-- Loading screen -->
    <div
      id="early-load"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 60px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        z-index: 99998;
      "
    >
      <h1
        style="
          color: #6b21a8;
          font-size: 28px;
          margin: 0 0 10px 0;
          font-weight: 600;
        "
      >
        Opictuary
      </h1>
      <p id="load-status" style="color: #666; font-size: 16px; margin: 0">
        Loading...
      </p>
      <p
        id="error-msg"
        style="
          color: #dc2626;
          font-size: 12px;
          margin: 10px 20px 0;
          max-width: 90%;
          word-break: break-all;
          display: none;
        "
      ></p>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Update debug banner - HTML parsed successfully
      try {
        document.getElementById("native-debug").textContent =
          "v1.4.0 | HTML OK";
        document.getElementById("native-debug").style.background = "#22c55e";
      } catch (e) {}

      window.debugLog = function (msg) {
        try {
          document.getElementById("load-status").textContent = msg;
          document.getElementById("native-debug").textContent =
            "v1.4.0 | " + msg;
          document.getElementById("native-debug").style.background = "#3b82f6";
        } catch (e) {}
        console.log("[DEBUG]", msg);
      };

      window.onerror = function (msg, url, line) {
        try {
          document.getElementById("load-status").textContent = "Error!";
          var errEl = document.getElementById("error-msg");
          errEl.textContent = msg + " (line " + line + ")";
          errEl.style.display = "block";
          document.getElementById("native-debug").textContent =
            "v1.4.0 | ERROR: " + msg;
          document.getElementById("native-debug").style.background = "#dc2626";
        } catch (e) {}
        return false;
      };

      window.onunhandledrejection = function (event) {
        window.onerror("Promise: " + event.reason, "", 0);
      };
    </script>
