name: Build Android
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup keystore
        run: |
          KEYSTORE=$(find . -name "signing.keystore" 2>/dev/null | head -1)
          echo "Found keystore at: $KEYSTORE"
          mkdir -p android
          cp "$KEYSTORE" android/signing.keystore
          
          cat > android/key.properties << EOF
          storeFile=signing.keystore
          storePassword=GXGr2ENYo1Xc
          keyAlias=my-key-alias
          keyPassword=GXGr2ENYo1Xc
          EOF
      
      - name: Create minimal Android project
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/res/values
          mkdir -p android/gradle/wrapper
          
          # Create minimal index.html
          cat > android/app/src/main/assets/public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Opictuary</title>
            <style>
              body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #2C1810; color: white; }
              .container { text-align: center; }
              h1 { font-size: 2em; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Opictuary</h1>
              <p>Digital Memorial Platform</p>
              <p>Loading...</p>
              <script>window.location.href = 'https://opictuary.replit.app';</script>
            </div>
          </body>
          </html>
          EOF
          
          # Create AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:icon="@mipmap/ic_launcher"
              android:label="@string/app_name"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:supportsRtl="true"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask"
                android:theme="@style/AppTheme.NoActionBarLaunch">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
            <uses-permission android:name="android.permission.INTERNET"/>
          </manifest>
          EOF
          
          # Create MainActivity.java
          mkdir -p android/app/src/main/java/com/opictuary/memorial
          cat > android/app/src/main/java/com/opictuary/memorial/MainActivity.java << 'EOF'
          package com.opictuary.memorial;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://opictuary.replit.app");
              }
              
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          
          # Create strings.xml
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Opictuary</string>
          </resources>
          EOF
          
          # Create styles.xml
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorPrimary">#2C1810</item>
              <item name="colorPrimaryDark">#1a0f0a</item>
              <item name="colorAccent">#D4AF37</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:background">#2C1810</item>
            </style>
          </resources>
          EOF
          
          # Create build.gradle (app)
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          
          def keystorePropertiesFile = rootProject.file('key.properties')
          def keystoreProperties = new Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          android {
              namespace "com.opictuary.memorial"
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.opictuary.memorial"
                  minSdk 22
                  targetSdk 34
                  versionCode 2025112700
                  versionName "2.1.0"
              }
              
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
              
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF
          
          # Create build.gradle (project)
          cat > android/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          
          # Create settings.gradle
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF
          
          # Create gradle.properties
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF
          
          # Create gradle wrapper properties
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          EOF
          
          # Create local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          
          # Create default icons
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # Download a simple icon placeholder
          curl -sL "https://via.placeholder.com/192/2C1810/D4AF37?text=O" -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || echo "Icon download failed, continuing..."
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png 2>/dev/null || true
      
      - name: Build Android Bundle
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || curl -sL https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle.zip && unzip -q gradle.zip && mv gradle-8.0/bin/gradle ./gradlew && chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/release/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
