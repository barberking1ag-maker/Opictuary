name: Build Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install NDK r28 for 16KB page size support
      run: |
        sdkmanager --install "ndk;28.0.12433566"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> $GITHUB_ENV
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build web app
      env:
        VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}
      run: npm run build
      
    - name: Verify web build
      run: |
        echo "=== Checking dist/public ==="
        ls -la dist/public/
        echo "=== Checking index.html ==="
        cat dist/public/index.html
        echo "=== Checking for built JS assets ==="
        ls -la dist/public/assets/ || echo "No assets folder"
      
    - name: Remove splash.png before sync
      run: |
        find android/app/src/main/res -name "splash.png" -type f -delete 2>/dev/null || true
        echo "Pre-sync cleanup done"
    
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Copy assets explicitly
      run: npx cap copy android
    
    - name: Remove splash.png after sync
      run: |
        find android/app/src/main/res -name "splash.png" -type f -delete 2>/dev/null || true
        echo "Post-sync cleanup done"
      
    - name: Verify Android assets
      run: |
        echo "=== Checking Android assets ==="
        ls -la android/app/src/main/assets/public/
        echo "=== Android index.html ==="
        cat android/app/src/main/assets/public/index.html
      
    - name: Fix SDK version
      run: |
        cat > android/variables.gradle << 'EOF'
        ext {
            minSdkVersion = 22
            compileSdkVersion = 35
            targetSdkVersion = 35
            androidxActivityVersion = '1.9.2'
            androidxAppCompatVersion = '1.7.0'
            androidxCoordinatorLayoutVersion = '1.2.0'
            androidxCoreVersion = '1.15.0'
            androidxFragmentVersion = '1.8.4'
            coreSplashScreenVersion = '1.0.1'
            androidxWebkitVersion = '1.12.1'
            junitVersion = '4.13.2'
            androidxJunitVersion = '1.2.1'
            androidxEspressoCoreVersion = '3.6.1'
            cordovaAndroidVersion = '10.1.1'
        }
        EOF
      
    - name: Configure build.gradle with 16KB support
      run: |
        cat > android/app/build.gradle << 'EOF'
        apply plugin: 'com.android.application'
        
        android {
            namespace "com.opictuary.memorial"
            compileSdk rootProject.ext.compileSdkVersion
            ndkVersion '28.0.12433566'
            
            defaultConfig {
                applicationId "com.opictuary.memorial"
                minSdkVersion rootProject.ext.minSdkVersion
                targetSdkVersion rootProject.ext.targetSdkVersion
                versionCode 2026012400
                versionName "2.6.14"
                testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            }
            
            packaging {
                jniLibs {
                    useLegacyPackaging = false
                }
            }
            
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }
        
        repositories {
            flatDir{
                dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
            }
        }
        
        dependencies {
            implementation fileTree(include: ['*.jar'], dir: 'libs')
            implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
            implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
            implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
            implementation project(':capacitor-android')
            testImplementation "junit:junit:$junitVersion"
            androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
            androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
            implementation project(':capacitor-cordova-android-plugins')
        }
        
        apply from: 'capacitor.build.gradle'
        
        try {
            def servicesJSON = file('google-services.json')
            if (servicesJSON.text) {
                apply plugin: 'com.google.gms.google-services'
            }
        } catch(Exception e) {
            logger.info("google-services.json not found")
        }
        EOF
        
        # Add extractNativeLibs=false to manifest for 16KB support
        sed -i 's/<application/<application android:extractNativeLibs="false"/' android/app/src/main/AndroidManifest.xml
        
        echo "=== app/build.gradle ==="
        cat android/app/build.gradle
        echo ""
        echo "=== AndroidManifest.xml application tag ==="
        grep -A2 "<application" android/app/src/main/AndroidManifest.xml
      
    - name: Build Release AAB
      working-directory: android
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        chmod +x gradlew
        # Remove duplicate splash.png files right before build
        find app/src/main/res -name "splash.png" -type f -delete
        echo "Removed splash.png duplicates"
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
          -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD
    
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/*.aab
        retention-days: 30
