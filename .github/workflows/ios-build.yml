name: iOS Build

on:
  push:
    branches: [main, opic1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_STRIPE_PUBLIC_KEY: ${{ secrets.VITE_STRIPE_PUBLIC_KEY }}

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Setup Keychain and Signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary-keychain-password-${{ github.run_id }}"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          echo "$CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PROFILE_PATH
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
          security default-keychain -s $KEYCHAIN_PATH
          
          echo "=== Verifying Certificate ==="
          security find-identity -v -p codesigning
          
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          
          echo "Profile UUID: $PP_UUID"
          echo "Profile Name: $PP_NAME"
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          
          echo "PP_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PP_NAME=$PP_NAME" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Configure App Target Signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          
          echo "=== BEFORE: Checking project signing settings ==="
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj || echo "No signing settings found"
          
          # Update App target signing in project.pbxproj
          python3 << 'EOF'
          import re
          import os
          
          pp_name = os.environ.get('PP_NAME', '')
          team_id = os.environ.get('TEAM_ID', '')
          
          print(f"Setting Profile: {pp_name}")
          print(f"Setting Team: {team_id}")
          
          with open('App.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          # Count matches before replacement
          pp_matches = len(re.findall(r'PROVISIONING_PROFILE_SPECIFIER = "";', content))
          team_matches = len(re.findall(r'DEVELOPMENT_TEAM = "";', content))
          print(f"Found {pp_matches} empty PROVISIONING_PROFILE_SPECIFIER entries")
          print(f"Found {team_matches} empty DEVELOPMENT_TEAM entries")
          
          # Replace empty values
          content = re.sub(
              r'PROVISIONING_PROFILE_SPECIFIER = "";',
              f'PROVISIONING_PROFILE_SPECIFIER = "{pp_name}";',
              content
          )
          
          content = re.sub(
              r'DEVELOPMENT_TEAM = "";',
              f'DEVELOPMENT_TEAM = "{team_id}";',
              content
          )
          
          with open('App.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          
          print("✅ Project updated successfully")
          EOF
          
          echo "=== AFTER: Checking project signing settings ==="
          grep -n "PROVISIONING_PROFILE_SPECIFIER\|DEVELOPMENT_TEAM" App.xcodeproj/project.pbxproj || echo "No signing settings found"
          
          echo "✅ App target signing configured"

      - name: Build and Archive
        run: |
          cd ios/App
          
          echo "Building archive..."
          
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            -showBuildTimingSummary \
            archive
          
          echo "✅ Archive created successfully"

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.opictuary.memoriol</key>
              <string>$PP_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist ExportOptions.plist
          
          echo "✅ IPA exported successfully"
          ls -la $RUNNER_TEMP/export/

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ${{ runner.temp }}/export/*.ipa

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $KEYCHAIN_PATH || true
          rm -f $RUNNER_TEMP/certificate.p12 || true
          rm -f $RUNNER_TEMP/profile.mobileprovision || true
