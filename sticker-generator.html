<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opictuary Sticker Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { margin-bottom: 20px; color: #333; }
  .controls { margin-bottom: 30px; display: flex; gap: 12px; }
  .controls button {
    padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px;
    cursor: pointer; font-weight: 600; transition: opacity 0.2s;
  }
  .controls button:hover { opacity: 0.85; }
  .btn-download { background: #5B2D8E; color: white; }
  .btn-download-2x { background: #7B4DAE; color: white; }
  canvas { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<h1>Opictuary Sticker Generator</h1>
<div class="controls">
  <button class="btn-download" onclick="downloadSticker(1)">Download (Standard)</button>
  <button class="btn-download-2x" onclick="downloadSticker(2)">Download (High-Res 2x)</button>
</div>
<canvas id="preview" width="600" height="950"></canvas>

<script>
const GOOGLE_PLAY_URL = "https://play.google.com/store/apps/details?id=com.opictuary.app";
const FEATURES = [
  "Immersive Memorial Hubs  |  AI-Guided Storytelling",
  "Multi-Faith Celebrations  |  Future Messages & Time Capsules",
  "QR-Connected Keepsakes  |  Family Trees & Collaboration",
  "Live Streaming  |  Wedding & Baby Registries",
  "Memorial Products"
];

async function loadIcon() {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = "client/public/icon-512.png";
  });
}

async function getQRDataUrl() {
  return new Promise((resolve) => {
    QRCode.toDataURL(GOOGLE_PLAY_URL, {
      width: 400, margin: 1,
      color: { dark: "#1a1a1a", light: "#ffffff" },
      errorCorrectionLevel: "H"
    }, (err, url) => resolve(err ? null : url));
  });
}

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

async function renderSticker(canvas, scale) {
  const W = 600 * scale;
  const H = 950 * scale;
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const s = scale;

  // Background
  roundRect(ctx, 0, 0, W, H, 30 * s);
  ctx.clip();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#5B2D8E");
  grad.addColorStop(0.55, "#7B4DAE");
  grad.addColorStop(1, "#3E1A6E");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // App icon
  const iconImg = await loadIcon();
  const iconSize = 160 * s;
  const iconX = (W - iconSize) / 2;
  const iconY = 50 * s;
  if (iconImg) {
    ctx.save();
    roundRect(ctx, iconX, iconY, iconSize, iconSize, 30 * s);
    ctx.clip();
    ctx.drawImage(iconImg, iconX, iconY, iconSize, iconSize);
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2.5 * s;
    roundRect(ctx, iconX, iconY, iconSize, iconSize, 30 * s);
    ctx.stroke();
  } else {
    // Fallback icon
    ctx.save();
    roundRect(ctx, iconX, iconY, iconSize, iconSize, 30 * s);
    ctx.fillStyle = "#4A1D7A";
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${80 * s}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.fillText("O", W / 2, iconY + iconSize * 0.72);
  }

  // "Download on" text
  ctx.fillStyle = "rgba(255,255,255,0.8)";
  ctx.font = `600 ${13 * s}px 'Segoe UI', sans-serif`;
  ctx.textAlign = "center";
  ctx.fillText("DOWNLOAD ON", W / 2, (iconY + iconSize + 40 * s));

  // "Google Play" text
  ctx.fillStyle = "#FFFFFF";
  ctx.font = `bold ${24 * s}px 'Segoe UI', sans-serif`;
  ctx.fillText("Google Play", W / 2, (iconY + iconSize + 72 * s));

  // QR Code
  const qrUrl = await getQRDataUrl();
  if (qrUrl) {
    const qrImg = await loadImage(qrUrl);
    if (qrImg) {
      const qrSize = 210 * s;
      const qrX = (W - qrSize) / 2;
      const qrY = iconY + iconSize + 95 * s;
      const pad = 14 * s;

      ctx.fillStyle = "#FFFFFF";
      roundRect(ctx, qrX - pad, qrY - pad, qrSize + pad * 2, qrSize + pad * 2, 14 * s);
      ctx.fill();
      ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

      // Divider
      const divY = qrY + qrSize + pad + 30 * s;
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.fillRect(50 * s, divY, W - 100 * s, 1 * s);

      // Brand name
      ctx.fillStyle = "#FFFFFF";
      ctx.font = `bold ${40 * s}px Georgia, 'Crimson Text', serif`;
      ctx.textAlign = "center";
      ctx.fillText("Opictuary", W / 2, divY + 48 * s);

      // Subtitle
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.font = `${16 * s}px 'Segoe UI', sans-serif`;
      ctx.fillText("A Celebration Memorial Legacy Platform", W / 2, divY + 78 * s);

      // Feature divider
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(60 * s, divY + 98 * s, W - 120 * s, 1 * s);

      // Features
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.font = `${12 * s}px 'Segoe UI', sans-serif`;
      let fy = divY + 125 * s;
      FEATURES.forEach((line) => {
        ctx.fillText(line, W / 2, fy);
        fy += 22 * s;
      });

      // Tagline
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.font = `italic ${11 * s}px Georgia, serif`;
      ctx.fillText("Honor every life, in every dimension.", W / 2, H - 30 * s);
    }
  }
}

async function downloadSticker(scale) {
  const offscreen = document.createElement("canvas");
  await renderSticker(offscreen, scale);
  const link = document.createElement("a");
  link.download = scale > 1 ? "opictuary-sticker-highres.png" : "opictuary-sticker.png";
  link.href = offscreen.toDataURL("image/png");
  link.click();
}

// Render preview
(async () => {
  const preview = document.getElementById("preview");
  await renderSticker(preview, 1);
})();
</script>
</body>
</html>
